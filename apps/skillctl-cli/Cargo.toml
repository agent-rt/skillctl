[package]
name         = "skillctl-cli"
description  = "skillctl: profile-driven Agent skill manager and protocol gateway"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "skillctl"
path = "src/main.rs"

[dependencies]
skillctl-core     = { workspace = true }
skillctl-id       = { workspace = true }
skillctl-skill    = { workspace = true }
skillctl-profile  = { workspace = true }
skillctl-version  = { workspace = true }
skillctl-store    = { workspace = true }
skillctl-source   = { workspace = true }
skillctl-agent    = { workspace = true }
skillctl-detect   = { workspace = true }
skillctl-protocol = { workspace = true }
skillctl-tui      = { workspace = true, optional = true }

clap               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
camino             = { workspace = true }
fs-err             = { workspace = true }
walkdir            = { workspace = true }
which              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["tui"]
tui     = ["dep:skillctl-tui"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
